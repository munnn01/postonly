[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postonly-video"
version = "0.1.0"
description = "Real-codec post-only baseline for video recognition"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "torchvision>=0.18", "numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
postonly = "postonly.cli:main"

[tool.setuptools.packages.find]
include = ["postonly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
